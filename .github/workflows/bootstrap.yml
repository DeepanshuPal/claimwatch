name: bootstrap
on:
  push:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize Claimwatch
        shell: bash
        run: |
          printf '%s' '' | base64 -d | tar -xz --strip-components=1
          rm -f .github/workflows/bootstrap.yml
          git config user.name 'Deepanshu Pal'
          git config user.email 'deepanshu@users.noreply.github.com'
          git add -A
          git commit -m 'Build Claimwatch MVP'
          git push
